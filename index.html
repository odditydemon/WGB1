#sheet h3{margin-bottom:.6rem}
.item{display:flex;justify-content:space-between;align-items:center;padding:.35rem 0;border-bottom:1px solid #333;gap:.5rem}

pre{white-space:pre-wrap;font:inherit;line-height:1.5}
.lvl{background:var(--gold);color:#000;font-weight:700;margin:0;min-height:34px;padding:.2rem .6rem;font-size:.8rem}

.scene{height:120px}.stage{height:175px}
.scene .ground,.stage .ground{position:absolute;left:0;right:0;bottom:0;height:24%}
.scene .it{position:absolute;line-height:1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.6));animation:sway 4s ease-in-out infinite alternate}
@keyframes sway{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.fighter{position:absolute;bottom:16%;line-height:1;animation:bob 2s ease-in-out infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.7))}
.fighter.pl{left:10%;font-size:3.6rem}
.fighter.pl img{width:76px;height:76px;border-radius:12px;object-fit:cover;border:2px solid rgba(255,255,255,.35);display:block}
.fighter.en{right:10%;font-size:4.8rem;animation-delay:.4s}
.fighter.en.boss{font-size:6.2rem;filter:drop-shadow(0 0 14px #f22)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fighter.hit{animation:hit .38s}
@keyframes hit{0%{transform:translateX(0);filter:brightness(2.2)}25%{transform:translateX(-10px)}50%{transform:translateX(9px);filter:brightness(1.6)}75%{transform:translateX(-5px)}100%{transform:translateX(0)}}
.pop{position:absolute;font-weight:800;font-size:1.5rem;text-shadow:0 2px 5px #000;animation:rise .95s ease-out forwards;pointer-events:none;z-index:3}
.pop.dmg{color:#fff}.pop.crit{color:var(--gold);font-size:2.1rem}.pop.hurt{color:var(--bad)}.pop.heal{color:var(--good)}.pop.miss{color:#9cf}.pop.buff{color:#8ab4ff}
@keyframes rise{0%{transform:translateY(0) scale(.7);opacity:0}15%{opacity:1;transform:translateY(-8px) scale(1.1)}100%{transform:translateY(-56px) scale(1);opacity:0}}
.road-ground{background:#6b5a3c}
.walker{position:absolute;bottom:17%;font-size:2.2rem;transition:left .5s ease;transform:translateX(-50%);z-index:2}
.dest{position:absolute;bottom:15%;font-size:2.8rem;line-height:1}
.portal{width:150px;height:150px;margin:.5rem auto 1rem;border-radius:50%;background:conic-gradient(#ff2a2a,#900,#300,#ff7a1a,#ff2a2a);animation:spin 7s linear infinite;position:relative;box-shadow:0 0 40px rgba(255,0,0,.55)}
.portal:after{content:"";position:absolute;inset:20px;border-radius:50%;background:radial-gradient(circle,#000 45%,#400 100%)}
@keyframes spin{to{transform:rotate(360deg)}}
#dlgBg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:20;align-items:center;justify-content:center;padding:1rem}
#dlgBg.on{display:flex}
#dlg{background:var(--panel2);border-radius:14px;padding:1.2rem;max-width:420px;width:100%;line-height:1.4}
#dlg p{margin-bottom:.8rem}
.tomb{font-size:5rem;line-height:1;margin:.5rem 0}

function ask(msg,onYes){dlgCb=onYes;$("dlgMsg").textContent=msg;$("dlgBg").classList.add("on");}

function dlgNo(){$("dlgBg").classList.remove("on");dlgCb=null;}
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const pct=(a,b)=>Math.max(0,Math.min(100,b?a/b*100:0));

}
function beep(f=440,d=.08,type="square",v=.04){
  if(!soundOn) return;
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);}catch(e){}
}
const sfx={hit:()=>beep(220,.08),crit:()=>{beep(440,.06);setTimeout(()=>beep(660,.1),60)},hurt:()=>beep(110,.15,"sawtooth"),

const dodgeChance=()=>Math.min(.35,totalSpeed()*.006);
const xpNeeded=()=>player.level*100;
function combinedStats(r,c){const m=races[r].mods,b=classes[c],f={};
  STATS.forEach(s=>f[s]=Math.min(Math.max(b[s]+m[s],0),999));return f;}

/* ============ SAVE / LOAD ============ */
const hasSave=()=>{try{return !!localStorage.getItem(SAVE_KEY)}catch(e){return false}};
function saveGame(quiet){
  if(!player||inCombat) return;
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({v:2,player,mission,progress,town,travel}));
    if(!quiet) log("Game saved.","info");}catch(e){if(!quiet)log("Could not save (storage unavailable).","bad");}
}
function loadGame(){
  let d; try{d=JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){}
  if(!d||!d.player){log("No saved game found.","bad");return;}
  player=d.player; mission=d.mission||null; progress=d.progress||0; town=d.town||"murim-village"; travel=Object.assign({alliance:0,village:0,route:null},d.travel||{});
  player.buffs=player.buffs||{def:0,defT:0,spd:0,spdT:0,evade:false};
  player.equipment=player.equipment||{weapon:null,armor:null};
  player.inventory=player.inventory||[]; player.hunterXp=player.hunterXp||0;
  gate=null;enemy=null;inCombat=false;closeSheet();
  log(`Welcome back, ${player.name}.`,"good"); show(town);
}
function newGame(force){
  if(player && !force){ask("Start a new game? Your current character will be lost.",()=>newGame(true));return;}
  player=null;mission=null;progress=0;gate=null;enemy=null;inCombat=false;travel={alliance:0,village:0,route:null};closeSheet();show("creation");
}

function updateHud(){

  const mm=totalMaxMp();
  $("hudName").innerHTML=`${player.name} · Lv ${player.level} ${player.class}${player.hunterRank?` · ${player.hunterRank}-Rank`:""}`+
    (player.xp>=xpNeeded()&&player.level<200?` <button class="lvl" onclick="levelUp()">LEVEL UP</button>`:"");
  $("hpFill").style.width=pct(player.hp,player.maxHp)+"%"; $("hpTxt").textContent=`HP ${player.hp}/${player.maxHp}`;
  $("mpFill").style.width=pct(player.mp,mm)+"%"; $("mpTxt").textContent=`MP ${player.mp}/${mm}`;
  $("hudGold").innerHTML=`💰 ${player.gold}`;

function initCreation(){

  $("imgIn").onchange=e=>{const f=e.target.files[0]; if(!f||!f.type.startsWith("image/"))return;
    const r=new FileReader(); r.onload=ev=>{const im=new Image(); im.onload=()=>{
      const c=document.createElement("canvas");c.width=c.height=96;const s=Math.min(im.width,im.height);
      c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,96,96);

}
function chips(id,opts,key){const c=$(id);c.innerHTML="";

function rollRace(){

  for(const [n,i] of Object.entries(races)){sum+=i.chance;if(r<=sum){sel.race=n;break;}}

function openTravel(route,ok){
  if(travel[route]===0&&!ok){ask(`The road is deadly: bandits Lv 11+, recommended level 10+. Death is permanent. Set out for ${route==="alliance"?"Murim Alliance":"Murim Village"}?`,()=>openTravel(route,true));return;}
  travel.route=route;show("travel-"+route);
}
function travelBack(route){
  if(travel[route]>0)return log("You cannot go back while traveling.","bad");
  travel.route=null;show(route==="alliance"?"murim-village":"murim-alliance");
}
function travelStep(route){
  travel.route=route;travel[route]++;
  log(`You travel toward ${route==="alliance"?"Murim Alliance":"Murim Village"}. (${travel[route]}/${TRAVEL_STEPS})`);
  if(travelHazard(route))return;
  afterTravel();
}
function travelHazard(route){
  const r=Math.random()*100;
  const fight=n=>{const d=travelBandits[n],st=banditStats(d.level);
    enemy={name:n,...st,xp:d.xp,gold:d.gold,isBoss:false,isTravel:true,slowT:0,boost:0};
    retScreen="travel-"+route;log(`A Level ${d.level} ${n} attacks you on the road!`,"bad");
    startCombat(enemy);return true;};
  if(r<50)return fight("Bandit");
  if(r<80)return fight("Bandit Vet");
  if(r<85)return fight("Bandit Chief");
  if(r<95){const g=rnd(1,100);player.gold+=g;log(`You find ${g} gold on the road.`,"gold");}
  else{player.hp=Math.max(1,player.hp-15);log("An arrow strikes you from the roadside! You lose 15 HP.","bad");}
  return false;
}
function banditStats(level){
  const b=combinedStats("Orc","Warrior"),l=level-1;
  const hp=b.hp+l*10;
  return {level,hp,maxHp:hp,mp:b.mp+l*5,attack:b.attack+l*2,defense:b.defense+l*2,speed:b.speed,magic:b.magic};
}
function afterTravel(){
  const route=travel.route;if(!route)return show(town);
  if(travel[route]>=TRAVEL_STEPS){
    travel={alliance:0,village:0,route:null};
    log(`You arrive at ${route==="alliance"?"Murim Alliance":"Murim Village"}.`,"good");
    return show(route==="alliance"?"murim-alliance":"murim-village");
  }
  show("travel-"+route);
}

function shopHtml(title,items,equip,back){
  let h=`<div class="card"><h3>${title}</h3><div class="muted">Gold: ${player.gold}</div>`;
  items.forEach(n=>{const c=consumables[n];h+=`<div class="item"><span>${n} <small>${c.desc}</small></span>${btn(c.price+"g",`buyItem('${n}')`,player.gold<c.price,"sm")}</div>`;});
  if(equip){h+=`<div class="lbl">Equipment for ${player.class}</div>`;
    Object.entries(equipmentItems).filter(([,e])=>e.class===player.class).forEach(([n,e])=>{
      const own=player.inventory.includes(n)||player.equipment.weapon===n||player.equipment.armor===n;
      h+=`<div class="item"><span>${n}<small>${statText(e)}</small></span>${own?`<span class="muted">Owned</span>`:btn(e.price+"g",`buyEquip('${n}')`,player.gold<e.price,"sm")}</div>`;});}

function buyItem(n){const c=consumables[n];if(player.gold<c.price)return log("Not enough gold!","bad");
  player.gold-=c.price;player.inventory.push(n);log(`Bought ${n}.`);show(current);}
function buyEquip(n){const e=equipmentItems[n];if(player.gold<e.price)return log("Not enough gold!","bad");
  player.gold-=e.price;player.inventory.push(n);log(`Bought ${n}.`);show(current);}
function equipItem(n){const e=equipmentItems[n];if(!e)return;
  if(e.class!==player.class)return log(`${n} cannot be equipped by your class.`,"bad");
  const old=player.equipment[e.type];if(old)player.inventory.push(old);
  player.inventory.splice(player.inventory.indexOf(n),1);player.equipment[e.type]=n;
  player.mp=Math.min(player.mp,totalMaxMp());log(`Equipped ${n}.`,"good");updateHud();
}
function unequip(slot){const n=player.equipment[slot];if(!n)return;player.equipment[slot]=null;player.inventory.push(n);
  player.mp=Math.min(player.mp,totalMaxMp());log(`Unequipped ${n}.`);updateHud();}

function rankUp(ok){

  if(r<.55){
    const pool=forestPool.filter(n=>monsters[n].level<=player.level+3);
    let n=pick(pool); if(mission&&pool.includes(mission.target)&&Math.random()<.4)n=mission.target;
    retScreen="forest";log(`A wild Level ${monsters[n].level} ${n} appears!`);startCombat(makeMonster(n));
  }else if(r<.78){const g=rnd(10,30)+player.level*2;player.gold+=g;log(`You found ${g} gold!`,"gold");updateHud();}
  else if(r<.86){player.inventory.push("Potion");log("You found a Potion in the underbrush!","good");}
  else log("The forest is quiet...");
}
function makeMonster(n){
  const b=monsters[n];
  return {name:n,level:b.level,hp:b.hp,maxHp:b.hp,mp:b.mp,attack:b.attack,defense:b.defense,speed:b.speed,magic:b.magic,
    xp:b.xp,gold:b.gold,goldBonus:0,isBoss:false,slowT:0,boost:0};
}
function enterGate(){
  gate={name:"Horned Rabbit Gate",wave:1,total:5};log("You step into the E-Rank Horned Rabbit Gate...","info");nextWave();
}
function nextWave(){
  const n=gate.wave===gate.total?"Horned Rabbit Alpha":"Horned Rabbit";
  retScreen="gate-run";log(gate.wave===gate.total?"The Alpha Horned Rabbit emerges!":`Wave ${gate.wave}: a Level ${monsters[n].level} Horned Rabbit charges!`);
  startCombat(makeMonster(n));
}
function leaveGate(){gate=null;log("You leave the gate.");show("murim-alliance");}

/* ============ COMBAT ============ */
function startCombat(e){enemy=e;inCombat=true;abOpen=false;player.defending=false;closeSheet();show("combat");renderCombat();}
function combatHtml(){
  if(!enemy)return "";const e=enemy,hasP=count("Potion"),hasS=count("Fire Scroll");
  const bg=combatBg(),icon=ENEMY_ICON[e.name]||"👾",me=player.img?`<img src="${player.img}" alt="">`:CLASS_ICON[player.class];
  let h=`<div class="stage" id="stage" style="background:linear-gradient(${bg.sky[0]},${bg.sky[1]})"><div class="ground" style="background:${bg.ground}"></div>
    <div class="fighter pl" id="plSprite">${me}</div><div class="fighter en ${e.isBoss?"boss":""}" id="enSprite">${icon}</div></div>
  <div class="card ${e.isBoss?"boss":""}"><h3>${e.isBoss?`<span style="color:#f44">BOSS FIGHT</span> – `:""}${e.isBoss?e.name:`Lv ${e.level} ${e.name}`}${gate?` <span class="muted">(Wave ${gate.wave}/${gate.total})</span>`:""}</h3>
  <div class="bar enemy"><i style="width:${pct(e.hp,e.maxHp)}%"></i><span>${e.hp}/${e.maxHp}</span></div>
  <div class="row" style="margin-top:.6rem">${btn("Attack","act('attack')")}${btn("Defend","act('defend')")}${btn("Abilities ▾","toggleAb()",false,"alt")}${btn("Run","act('run')",e.isBoss,"alt")}</div>`;
  if(abOpen){h+=`<div class="lbl" style="margin-top:.4rem">Abilities</div><div class="row">`;
    player.abilities.forEach((a,i)=>{if(player.level>=a.unlockLevel)h+=btn(`${a.name} (${a.mpCost} MP)`,`useAbility(${i})`,player.mp<a.mpCost,"sm");});h+=`</div>`;}
  if(hasP||hasS){h+=`<div class="lbl" style="margin-top:.4rem">Items</div><div class="row">`;
    if(hasP)h+=btn(`Potion ×${hasP}`,"useItem('Potion')",false,"sm alt");
    if(count("Hi-Potion"))h+=btn(`Hi-Potion ×${count("Hi-Potion")}`,"useItem('Hi-Potion')",false,"sm alt");
    if(count("Mana Potion"))h+=btn(`Mana Potion ×${count("Mana Potion")}`,"useItem('Mana Potion')",false,"sm alt");
    if(hasS)h+=btn(`Fire Scroll ×${hasS}`,"useItem('Fire Scroll')",false,"sm alt");h+=`</div>`;}
  return h+`</div>`;
}
function renderCombat(){if(!enemy)return;$("area").innerHTML=combatHtml();updateHud();flushFx();}
function toggleAb(){abOpen=!abOpen;renderCombat();}

function rollCrit(d){if(Math.random()<.1){lastCrit=true;log("Critical hit!","gold");sfx.crit();return Math.floor(d*1.5);}lastCrit=false;sfx.hit();return d;}
function calcDamage(base,kind){
  const def=enemy.defense||0;
  return Math.max(2,base-(kind==="magic"?Math.floor(def/2):def));
}
function hitEnemy(d,label){
  enemy.hp=Math.max(0,enemy.hp-d);log(`${label} for ${d} damage.`);fx('enemy','-'+d,lastCrit?'crit':'dmg');
  if(enemy.hp<=0)return victory();
  enemyTurn();
}
function act(k){
  if(!inCombat||!enemy)return;
  if(k==="attack"){
    let dmg=calcDamage(totalAttack(),"phys");
    if(player.class==="Mage")dmg=Math.max(dmg,calcDamage(Math.floor(totalMagic()*.8),"magic"));
    hitEnemy(rollCrit(dmg),`You hit ${enemy.name}`);
  }else if(k==="defend"){player.defending=true;log("You brace for the attack.");enemyTurn();}
  else if(k==="run"){
    if(enemy.isBoss)return log("You can't run from a boss!","bad");
    if(Math.random()<Math.min(.85,.4+totalSpeed()*.02)){log("You fled the battle.");const wasTravel=enemy.isTravel;enemy=null;inCombat=false;gate=null;if(wasTravel)return afterTravel();show(retScreen==="gate-run"?"murim-alliance":retScreen);}
    else{log("You couldn't escape!","bad");enemyTurn();}
  }
}
function useAbility(i){
  const a=player.abilities[i];if(!a||player.mp<a.mpCost)return log("Not enough MP!","bad");
  player.mp-=a.mpCost;abOpen=false;
  if(a.effect==="damage"||a.effect==="damage_slow"){
    const magic=a.stat==="magic",base=magic?totalMagic():totalAttack();
    if(a.effect==="damage_slow"){enemy.slowT=2;}
    return hitEnemy(rollCrit(calcDamage(Math.floor(base*a.multiplier),magic?"magic":"phys")),`You used ${a.name}${a.effect==="damage_slow"?` (${enemy.name} is slowed!)`:""}`);
  }
  if(a.effect==="defense"){fx("player","DEF +"+a.bonus,"buff");player.buffs.def=a.bonus;player.buffs.defT=a.turns;log(`You used ${a.name}! Defense +${a.bonus} for ${a.turns} turns.`,"info");}
  if(a.effect==="speed"){fx("player","SPD +"+a.bonus,"buff");player.buffs.spd=a.bonus;player.buffs.spdT=a.turns;log(`You used ${a.name}! Speed +${a.bonus} for ${a.turns} turns.`,"info");}
  if(a.effect==="evasion"){fx("player","Vanish","buff");player.buffs.evade=true;log(`You used ${a.name}! You will evade the next attack.`,"info");}
  enemyTurn();
}
function useItem(n){
  const c=consumables[n];if(!c||!player.inventory.includes(n))return;
  if(c.combatOnly&&!inCombat)return log(`${n} can only be used in combat.`,"bad");
  if(c.heal){if(player.hp>=player.maxHp)return log("You're already at full HP.");
    player.hp=Math.min(player.maxHp,player.hp+c.heal);fx('player','+'+c.heal,'heal');log(`You used a ${n} and restored ${c.heal} HP.`,"good");}
  if(c.mana){const mm=totalMaxMp();if(player.mp>=mm)return log("You're already at full MP.");
    player.mp=Math.min(mm,player.mp+c.mana);fx('player','+'+c.mana+' MP','heal');log(`You used a ${n} and restored ${c.mana} MP.`,"good");}
  let d=0;if(c.dmg){d=rollCrit(c.dmg);enemy.hp=Math.max(0,enemy.hp-d);fx('enemy','-'+d,lastCrit?'crit':'dmg');log(`You used a ${n} and dealt ${d} damage to ${enemy.name}.`);}
  player.inventory.splice(player.inventory.indexOf(n),1);
  if(inCombat){closeSheet();if(enemy.hp<=0)return victory();enemyTurn();}
  else{updateHud();if(current==="gate-run")show("gate-run");}
}
function hitPlayer(raw,src){
  if(player.buffs.evade){player.buffs.evade=false;fx("player","Miss","miss");log(`You vanish – ${src} misses!`,"good");return;}
  if(Math.random()<dodgeChance()){fx("player","Dodge","miss");log(`You dodge ${src}!`,"good");return;}
  let d=Math.max(2,raw-Math.floor(totalDefense()*.6));if(player.defending)d=Math.max(1,Math.floor(d/2));
  player.hp=Math.max(0,player.hp-d);sfx.hurt();fx('player','-'+d,'hurt');log(`${src} hits you for ${d} damage.`,"bad");
}
function enemyTurn(){
  if(!enemy)return;
  const lv=Math.floor((enemy.level||1)/2);
  let raw=enemy.attack+lv,src=enemy.name,skip=false;
  if(enemy.isBoss){
    enemy.mp=Math.min(enemy.mp+5,999);
    if(enemy.mp>=20&&Math.random()<.5){
      const ab=pick(enemy.abilities);enemy.mp-=20;
      if(ab==="Attack Boost 4"){enemy.boost=2;skip=true;log(`${enemy.name} used ${ab}! Its next attack will be devastating!`,"bad");}
      else if(ab==="Absolute Rule"){player.buffs={def:0,defT:0,spd:0,spdT:0,evade:false};skip=true;log(`${enemy.name} used ${ab}! All your buffs are nullified!`,"bad");}
      else{raw=Math.floor(enemy.attack*1.8)+lv;src=`${enemy.name}'s ${ab}`;}
    }
    if(!skip&&enemy.boost){raw*=enemy.boost;enemy.boost=0;}
  }
  if(!skip){if(enemy.slowT>0){raw=Math.floor(raw*.6);enemy.slowT--;}hitPlayer(raw,src);}
  const b=player.buffs;
  if(b.defT>0&&--b.defT===0){b.def=0;log("Your defense buff wore off.");}
  if(b.spdT>0&&--b.spdT===0){b.spd=0;log("Your speed buff wore off.");}
  player.defending=false;player.mp=Math.min(totalMaxMp(),player.mp+(totalMaxMp()>=30?2:1));
  if(player.hp<=0)return defeat();
  renderCombat();
}
function clearBuffs(){player.buffs={def:0,defT:0,spd:0,spdT:0,evade:false};player.defending=false;}
function permaDeath(){
  const e=enemy;
  const place=e.isBoss?"a rank trial":e.isTravel?"the road":gate?"the "+gate.name:"the forest";
  grave={name:player.name,cls:player.class,race:player.race,level:player.level,killer:e.isBoss?e.name:`a Lv ${e.level} ${e.name}`,place};
  log(`${player.name} has fallen. There is no coming back.`,"bad");sfx.hurt();
  enemy=null;inCombat=false;gate=null;mission=null;progress=0;travel={alliance:0,village:0,route:null};
  try{localStorage.removeItem(SAVE_KEY);}catch(err){}
  player=null;closeSheet();show("game-over");
}
function defeat(){permaDeath();}
function victory(){
  const e=enemy;enemy=null;inCombat=false;clearBuffs();sfx.win();
  if(e.isBoss){
    const next=RANK_ORDER[RANK_ORDER.indexOf(e.rank)+1],g=player.level*100;
    player.hunterXp=Math.max(0,player.hunterXp-rankThresholds[e.rank]);player.gold+=g;player.hunterRank=next;
    log(`You defeated ${e.name}! Promoted to ${next}-Rank and earned ${g} gold!`,"gold");
    return show(retScreen);
  }
  const xp=e.xp,g=e.gold+(e.goldBonus||0);
  player.xp+=xp;player.gold+=g;if(player.hunterRank)player.hunterXp+=xp;
  log(`Defeated Level ${e.level} ${e.name}! +${xp} XP, +${g} gold.`,"good");
  if(mission&&e.name===mission.target){progress++;log(`Mission progress: ${progress}/${mission.count}`,"info");
    if(progress>=mission.count){player.xp+=mission.rewardXP;player.gold+=mission.rewardGold;player.hunterXp+=mission.rewardXP;
      log(`Mission complete: ${mission.name}! +${mission.rewardXP} XP, +${mission.rewardGold} gold.`,"gold");mission=null;progress=0;}}
  if(gate){
    if(gate.wave>=gate.total){const r=200+player.level*20;player.gold+=r;player.hunterXp+=100;
      log(`${gate.name} cleared! Bonus: ${r} gold and 100 hunter points.`,"gold");gate=null;return show("gate-selection");}
    gate.wave++;log("Wave cleared. Catch your breath before the next one.","info");
  }
  if(e.isTravel)return afterTravel();
  show(retScreen);
}

/* ============ PROGRESSION ============ */
function levelUp(){
  if(player.xp<xpNeeded()||player.level>=200)return;
  const g=growth[player.class];player.xp-=xpNeeded();player.level++;
  player.maxHp+=10;player.maxMp+=5;player.attack+=g.attack;player.defense+=g.defense;player.magic+=g.magic;player.speed+=g.speed;
  player.hp=player.maxHp;player.mp=totalMaxMp();sfx.lvl();
  const unlocked=player.abilities.filter(a=>a.unlockLevel===player.level).map(a=>a.name);
  log(`Level up! Now level ${player.level}. HP and MP restored.${unlocked.length?" New ability: "+unlocked.join(", ")+"!":""}`,"gold");
  updateHud();if(current!=="combat")show(current);
}

/* ============ BOOT ============ */
log("Welcome to World's Gate.","info");
show("title");
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
